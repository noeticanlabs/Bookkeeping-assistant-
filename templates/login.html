<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Bookkeeper Assistant</title>
<style>body{font-family:system-ui,sans-serif;max-width:440px;margin:4rem auto;padding:0 1rem}.card{border:1px solid #ddd;border-radius:10px;padding:1.25rem}form{display:grid;gap:.8rem}input,button{padding:.7rem;font:inherit}.error{background:#ffecec;padding:.6rem;border-radius:6px}</style></head>
<body><h1>Bookkeeper Assistant</h1><div class="card"><h2>Sign in</h2>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="{{category}}">{{message}}</p>{% endfor %}{% endwith %}
<form method="post"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form></div></body></html>
