<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approval Policy</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem}form{display:grid;gap:1rem;max-width:520px}input,button{padding:.65rem;font:inherit}.error{background:#ffecec;padding:.6rem}.success{background:#edf9ed;padding:.6rem}</style></head><body><p><a href="/">← Dashboard</a></p><h1>Approval policy</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="{{category}}">{{message}}</p>{% endfor %}{% endwith %}<form method="post"><label><input type="checkbox" name="prevent_self_approval" {% if policy.prevent_self_approval %}checked{% endif %}> Prevent a proposer from approving their own request</label><label>Two independent approvals required at or above this amount<input name="second_approval_threshold" type="number" step="0.01" min="0" value="{{ policy.second_approval_threshold if policy.second_approval_threshold is not none else '' }}"></label><button>Save approval policy</button></form></body></html>
