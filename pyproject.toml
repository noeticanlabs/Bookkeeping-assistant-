[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookkeeper-ai"
version = "0.1.0"
description = "Governed AI-assisted bookkeeping with deterministic accounting controls"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
